# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo, then New > Blueprint on Render and point it here.
# ADMIN_TOKEN is generated by Render and never stored in the repo.
services:
  - type: web
    name: corporate-flight-booking
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Generated once by Render. Read it from the dashboard to unlock the
      # admin console; the booking journey needs no token.
      - key: ADMIN_TOKEN
        generateValue: true
